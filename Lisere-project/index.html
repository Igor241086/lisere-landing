    <style>
      html,
      body {
        background: #edebed;
      }
      #preloader {
        --pl-write: 2.6s;
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #edebed;
        color: #0a0a0a;
        transition: opacity 0.8s ease-in-out;
      }
      #preloader.pl-hide {
        opacity: 0;
        pointer-events: none;
      }
      .pl-center {
        position: relative;
      }
      .pl-logo {
        display: block;
        width: clamp(140px, 14.2vw, 204px);
        height: auto;
        overflow: visible;
      }
      .pl-strokes {
        fill: none;
        stroke: #fff;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .pl-strokes path {
        stroke-dasharray: 1 2;
        stroke-dashoffset: 1;
        opacity: 0;
        animation: pl-write calc(var(--d) * var(--pl-write)) linear calc(var(--s) * var(--pl-write))
          both;
      }
      .pl-strokes .pl-dot {
        stroke-dasharray: none;
        stroke-dashoffset: 0;
        stroke-width: 0;
        animation-name: pl-pop;
      }
      .pl-status {
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        margin-top: clamp(20px, 3.2vw, 46px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        font-family: 'DM Sans', system-ui, sans-serif;
      }
      .pl-spinner {
        width: clamp(18px, 1.8vw, 26px);
        height: auto;
        animation: pl-spin 0.9s steps(8, end) infinite;
      }
      .pl-spinner line {
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
      }
      .pl-percent {
        font-size: clamp(14px, 1.3vw, 18px);
        line-height: 1;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
      }
      @keyframes pl-write {
        0% {
          stroke-dashoffset: 1;
          opacity: 0;
        }
        1% {
          opacity: 1;
        }
        100% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
      }
      @keyframes pl-pop {
        0% {
          stroke-width: 0;
          opacity: 0;
        }
        1% {
          opacity: 1;
        }
        100% {
          stroke-width: var(--w);
          opacity: 1;
        }
      }
      @keyframes pl-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pl-strokes path {
          animation: none;
          stroke-dashoffset: 0;
          opacity: 1;
        }
        .pl-strokes .pl-dot {
          stroke-width: var(--w);
        }
        .pl-spinner {
          animation-duration: 2.4s;
        }
      }
    </style>

        function frame(now) {
          var dt = now - last;
          last = now;

          bundle = mounted ? 1 : Math.min(0.97, bundle + (1 - bundle) * (1 - Math.exp(-dt / 4000)));

          var real = 0.5 * bundle + 0.5 * assets;

          var x = WRITE ? Math.min(1, (now - t0) / WRITE) : 1;
          var written = 0.5 - Math.cos(Math.PI * x) / 2;

          var target = Math.min(real, written);
          shown += (target - shown) * (1 - Math.exp(-dt / 90));
          if (target >= 1 && shown > 0.995) shown = 1;
          pctEl.textContent = Math.round(shown * 100) + '%';

          if (shown === 1) {
            setTimeout(exit, HOLD);
          } else {
            requestAnimationFrame(frame);
          }
        }
        requestAnimationFrame(frame);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
